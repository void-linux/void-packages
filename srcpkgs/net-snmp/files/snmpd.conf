# Example configuration for the Net-SNMP agent, snmpd
# See the snmpd.conf(5) man page for details

#
#  AGENT BEHAVIOUR
#

#  Listen for connections from the local system only
agentAddress  udp:127.0.0.1:161
#  Listen for connections on all interfaces (both IPv4 *and* IPv6)
#agentAddress udp:161,udp6:[::]:161

#
#  ACCESS CONTROL
#

#  system + hrSystem groups only
view   systemonly  included   .1.3.6.1.2.1.1
view   systemonly  included   .1.3.6.1.2.1.25.1

#  SNMPv1/v2c community access is disabled.
#rocommunity  CHANGEME  localhost  -V systemonly

#  SNMPv3 users are created with 'net-snmp-create-v3-user' while snmpd is
#  stopped; it appends the createUser line to /var/net-snmp/snmpd.conf.
#  Grant the created user read-only access to the systemonly view here:
#rouser  authPrivUser  priv  -V systemonly


#
#  SYSTEM INFORMATION
#

sysLocation    Unknown
sysContact     root@localhost
sysServices    72
