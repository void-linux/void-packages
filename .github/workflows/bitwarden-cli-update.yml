name: 'bitwarden-cli auto-update'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for new release, update template
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          template="srcpkgs/bitwarden-cli/template"

          current="$(grep -oP '^version=\K.*' "$template")"
          latest_tag="$(curl -fsSL "https://api.github.com/repos/bitwarden/clients/releases?per_page=30" | jq -r '[.[] | select(.tag_name | startswith("cli-v"))][0].tag_name')"
          latest="${latest_tag#cli-v}"
          echo "current=$current latest=$latest"

          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "Could not determine latest cli- release; aborting." >&2
            exit 1
          fi
          if [ "$latest" = "$current" ]; then
            echo "Already up to date ($current); nothing to do."
            exit 0
          fi

          branch="auto/bitwarden-cli-$latest"
          if [ -n "$(gh pr list --state open --head "$branch" --json number --jq '.[].number')" ]; then
            echo "An open PR already exists for $branch; nothing to do."
            exit 0
          fi

          sum="$(curl -fsSL "https://github.com/bitwarden/clients/archive/refs/tags/${latest_tag}.tar.gz" | sha256sum | cut -d' ' -f1)"

          sed -i -E "s/^version=.*/version=$latest/" "$template"
          sed -i -E "s/^revision=.*/revision=1/" "$template"
          sed -i -E "s/^checksum=.*/checksum=$sum/" "$template"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Commit and open PR
        if: steps.update.outputs.changed == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.update.outputs.branch }}
          LATEST: ${{ steps.update.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name "Zoa Hickenlooper"
          git config user.email "zoa@router.sex"
          git checkout -B "$BRANCH"
          git add srcpkgs/bitwarden-cli/template
          git commit -m "bitwarden-cli: update to $LATEST."
          git push --force origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "bitwarden-cli: update to $LATEST." \
            --body "Automated update to bitwarden-cli $LATEST.

          No GPG verification available (bitwarden/clients uses unsigned lightweight tags) — checksum-pinned from the GitHub release tarball only.

          Release notes: https://github.com/bitwarden/clients/releases/tag/cli-v$LATEST"
